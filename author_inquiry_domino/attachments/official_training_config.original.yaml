datasets:
  vla_data:
    action_mode: abs
    data_mix: domino_clean_wrap
    data_root_dir: ./playground/Datasets/DOMINO
    dataset_py: lerobot_datasets
    image_size:
    - 224
    - 224
    image_size_buckets:
    - - 320
      - 180
    - - 280
      - 210
    per_device_batch_size: 16
    sequential_step_sampling: false
    video_backend: pyav
framework:
  action_model:
    action_dim: 14
    action_hidden_dim: 2560
    action_model_type: DiT-B
    future_action_window_size: 31
    past_action_window_size: 0
  name: QwenOFT
  qwenvl:
    base_vlm: StarVLA/Qwen3-VL-4B-Instruct
output_dir: ./results/Checkpoints/VLAct_Qwen3OFT_Domino_Finetune
run_id: VLAct_Qwen3OFT_Domino_Finetune
run_root_dir: ./results/Checkpoints
seed: 42
trainer:
  eval_interval: 100
  freeze_modules: true
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  is_resume: false
  learning_rate:
    action_model: 0.0001
    base: 0.0001
    qwen_vl_interface: 1.0e-05
  logging_frequency: 100
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 100000
  num_warmup_steps: 5000
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  pretrained_checkpoint: ./results/Checkpoints/VLAct_Qwen3_Pretrain/checkpoints/steps_100000_pytorch_model.pt
  random_init_action_model: true
  reset_steps: true
  save_interval: 20000
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  shortest_angular_joint_loss: true
wandb_entity: your_name
wandb_project: starVLA_DOMINO
